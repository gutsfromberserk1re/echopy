name: Build Echo

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard ordered-set

      - name: Compile with Nuitka
        shell: bash
        run: |
          ICON_ARG=""
          if [ -f recorder.ico ]; then
            ICON_ARG="--windows-icon-from-ico=recorder.ico --include-data-files=recorder.ico=recorder.ico"
          fi

          python -m nuitka echo.py \
            --onefile \
            --enable-plugin=pyside6 \
            --include-qt-plugins=multimedia \
            --windows-console-mode=disable \
            --output-filename=Echo.exe \
            --output-dir=dist \
            --product-name=Echo \
            --file-description="Echo voice recorder" \
            --assume-yes-for-downloads \
            $ICON_ARG

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-windows
          path: dist/Echo.exe

      - name: Publish the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          gh release delete latest --cleanup-tag --yes --repo "${{ github.repository }}" || true
          gh release create latest dist/Echo.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Echo - latest build" \
            --notes "Automatic build of commit $SHORT. Download **Echo.exe** below and run it, no install needed."
