```yaml
name: Build Echo

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 sounddevice numpy
          python -m pip install "Nuitka[onefile]"

      - name: Build single-file executable
        shell: cmd
        run: |
          python -m nuitka ^
            --mode=onefile ^
            --enable-plugin=pyside6 ^
            --windows-console-mode=disable ^
            --output-dir=build ^
            --output-filename=Echo.exe ^
            --assume-yes-for-downloads ^
            echo.py

      - name: Include icon if available
        if: false
        run: echo Optional icon configuration

      - name: Upload Echo.exe
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Windows-x64
          path: build/Echo.exe
          if-no-files-found: error
          retention-days: 14
```
