name: Build Echo

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 sounddevice numpy nuitka ordered-set zstandard

      - name: Build Echo with Nuitka
        shell: pwsh
        run: |
          $args = @(
            "--mode=standalone",
            "--enable-plugin=pyside6",
            "--windows-console-mode=disable",
            "--assume-yes-for-downloads",
            "--output-dir=build",
            "--output-filename=Echo.exe",
            "--windows-icon-from-ico=recorder.ico",
            "--include-qt-plugins=multimedia",
            "--include-module=sounddevice",
            "--include-module=numpy",
            "--follow-imports",
            "echo.py"
          )

          python -m nuitka @args

      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/echo.dist/*" `
            -DestinationPath "Echo-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Windows-x64
          path: Echo-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
